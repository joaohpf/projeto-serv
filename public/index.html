<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeRV — Sistema Educacional de Rio Verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   SeRV — Sistema Educacional de Rio Verde
   Estética: glassmorphism institucional, premium, tecnológica.
   Paleta de cores (variáveis em :root) — fácil de editar.
   ===================================================================== */
:root{
  --white:#FFFFFF;
  --gray-100:#F0F4F8;
  --gray-200:#E7EBF1;
  --green-dark:#006F48;   /* verde institucional escuro */
  --green-mid:#267A3F;    /* verde médio */
  --orange:#F8863E;       /* laranja principal */
  --orange-dark:#E27331;  /* laranja escuro */
  --navy:#344272;         /* azul-marinho */
  --graphite:#2E343E;     /* grafite */
  --brown:#64493F;        /* marrom acinzentado */

  --glass-bg: rgba(255,255,255,.55);
  --glass-bg-strong: rgba(255,255,255,.72);
  --glass-border: rgba(255,255,255,.65);
  --glass-shadow: 0 18px 50px -18px rgba(46,52,62,.35), 0 2px 8px rgba(46,52,62,.06);
  --soft-shadow: 0 8px 20px -8px rgba(46,52,62,.25);
  --radius: 22px;
  --radius-sm: 14px;
  --ease: cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Be Vietnam Pro',sans-serif;
  color:var(--graphite);
  background:var(--gray-100);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.font-display{font-family:'Sora',sans-serif;letter-spacing:-.02em}

/* ---------- Fundo: gradientes em malha + partículas ---------- */
#bg-mesh{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(1200px 700px at 12% 8%, rgba(0,111,72,.18), transparent 60%),
  radial-gradient(900px 600px at 88% 12%, rgba(52,66,114,.20), transparent 60%),
  radial-gradient(1000px 700px at 78% 92%, rgba(248,134,62,.16), transparent 60%),
  radial-gradient(800px 600px at 8% 88%, rgba(38,122,63,.14), transparent 60%),
  linear-gradient(160deg,#F4F7FB 0%,#E7EBF1 100%);
}
#bg-mesh::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(rgba(52,66,114,.06) 1px,transparent 1px);
  background-size:26px 26px;mask-image:radial-gradient(80% 80% at 50% 40%,#000,transparent);}
#particles{position:fixed;inset:0;z-index:-1;pointer-events:none}

/* ---------- Utilidades glass ---------- */
.glass{
  background:var(--glass-bg);
  backdrop-filter:blur(22px) saturate(140%);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
}
.glow-btn{
  position:relative;border:none;cursor:pointer;font-family:'Sora',sans-serif;font-weight:600;
  color:#fff;border-radius:14px;padding:13px 22px;font-size:.95rem;letter-spacing:.01em;
  background:var(--navy);
  box-shadow:var(--soft-shadow);transition:transform .35s var(--ease),box-shadow .35s var(--ease),filter .3s;
  display:inline-flex;align-items:center;gap:9px;
}
.glow-btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px -10px rgba(46,52,62,.35);filter:brightness(1.06)}
.glow-btn:active{transform:translateY(0)}
.glow-btn.green{background:var(--green-dark);box-shadow:var(--soft-shadow)}
.glow-btn.green:hover{box-shadow:0 12px 26px -10px rgba(46,52,62,.35)}
.glow-btn.orange{background:var(--orange);box-shadow:var(--soft-shadow)}
.glow-btn.orange:hover{box-shadow:0 12px 26px -10px rgba(46,52,62,.35)}
.btn-ghost{background:var(--glass-bg-strong);color:var(--navy);border:1px solid var(--glass-border);box-shadow:none}
.btn-ghost:hover{box-shadow:0 6px 16px -8px rgba(46,52,62,.3)}

/* badge de ícone "glass 3D" */
.gicon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:linear-gradient(150deg,rgba(255,255,255,.85),rgba(255,255,255,.25));
  border:1px solid rgba(255,255,255,.8);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.9),0 8px 20px -8px rgba(46,52,62,.4);
  position:relative;overflow:hidden;}
.gicon::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent 55%);}
.gicon svg{width:24px;height:24px;position:relative;z-index:1}

/* ============================ LOGIN ============================ */
#login-screen{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative}
.login-card{display:flex;width:min(920px,100%);border-radius:28px;overflow:hidden;
  background:var(--glass-bg-strong);backdrop-filter:blur(26px) saturate(150%);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
  border:1px solid var(--glass-border);
  box-shadow:0 40px 90px -30px rgba(46,52,62,.45),0 2px 10px rgba(46,52,62,.08);
  animation:rise .8s var(--ease) both}
.login-brand{flex:1.2;padding:54px 46px;display:flex;flex-direction:column;justify-content:center;gap:22px;
  background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(231,235,241,.6));position:relative}
.login-brand img{width:108px;filter:drop-shadow(0 10px 18px rgba(46,52,62,.18))}
.brand-name{font-size:2.5rem;font-weight:800;line-height:1;color:var(--green-dark)}
.brand-name span{color:var(--orange)}
.brand-sub{font-size:1.02rem;color:var(--navy);font-weight:500;max-width:320px;line-height:1.4}
.brand-tagline{margin-top:4px;font-family:'Sora';font-weight:700;color:var(--graphite);font-size:.82rem;letter-spacing:.18em;opacity:.6}
.login-form{flex:1;padding:50px 42px;background:var(--green-dark);color:#fff;
  display:flex;flex-direction:column;justify-content:center;gap:18px;position:relative;overflow:hidden}
.login-form h2{font-size:1.55rem;font-weight:700;position:relative}
.field{position:relative}
.field label{display:block;font-size:.78rem;font-weight:500;opacity:.85;margin:0 0 6px 2px;letter-spacing:.03em}
.field .wrap{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.28);border-radius:12px;padding:11px 14px;transition:.3s var(--ease)}
.field .wrap:focus-within{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.6);box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.field .wrap svg{width:18px;height:18px;opacity:.85;flex:none}
.field input{flex:1;background:none;border:none;color:#fff;font-family:inherit;font-size:.95rem;outline:none}
.field input::placeholder{color:rgba(255,255,255,.6)}
.eye{cursor:pointer;opacity:.8;transition:.2s}.eye:hover{opacity:1}
.login-row{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.link{background:none;border:none;color:rgba(255,255,255,.85);font-family:inherit;font-size:.82rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px;transition:.2s}
.link:hover{color:#fff}
.login-form .glow-btn{justify-content:center;width:100%;margin-top:6px;background:var(--orange);box-shadow:0 8px 20px -8px rgba(46,52,62,.35)}
.login-form .glow-btn:hover{background:var(--orange-dark);box-shadow:0 12px 24px -10px rgba(46,52,62,.4)}
.login-err{font-size:.8rem;color:#ffd9c2;min-height:1em}

/* ============================ APP SHELL ============================ */
#app{display:none;min-height:100vh}
#app.show{display:grid;grid-template-columns:264px 1fr}

/* Sidebar */
.sidebar{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(231,235,241,.45));
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-right:1px solid rgba(255,255,255,.6);z-index:30}
.sb-brand{display:flex;align-items:center;gap:12px;padding:6px 8px 16px}
.sb-brand img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:12px;padding:4px;box-shadow:0 6px 16px -6px rgba(46,52,62,.35)}
.sb-brand .t{font-family:'Sora';font-weight:800;font-size:1.15rem;color:var(--green-dark);line-height:1}
.sb-brand .t span{color:var(--orange)}
.sb-brand .s{font-size:.6rem;color:var(--navy);letter-spacing:.08em;font-weight:500}
.nav-item{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:13px;cursor:pointer;color:var(--graphite);
  font-size:.92rem;font-weight:500;border:1px solid transparent;transition:.28s var(--ease);position:relative}
.nav-item svg{width:20px;height:20px;opacity:.7;flex:none;transition:.28s}
.nav-item:hover{background:rgba(255,255,255,.65);transform:translateX(3px)}
.nav-item.active{background:var(--green-dark);color:#fff;border-color:rgba(255,255,255,.35);
  box-shadow:0 4px 12px -6px rgba(46,52,62,.3)}
.nav-item.active svg{opacity:1}
.nav-sep{height:1px;background:rgba(52,66,114,.12);margin:8px 6px}
.sb-foot{margin-top:auto}

/* Topbar / Navbar com blur */
.main{display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:25;display:flex;align-items:center;justify-content:space-between;
  padding:14px 26px;margin:14px 18px;border-radius:18px;
  background:rgba(255,255,255,.55);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--glass-border);box-shadow:0 10px 30px -16px rgba(46,52,62,.4)}
.tb-user{display:flex;align-items:center;gap:14px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--green-dark);
  display:grid;place-items:center;color:#fff;font-family:'Sora';font-weight:700;box-shadow:0 4px 10px -4px rgba(46,52,62,.3)}
.tb-user .name{font-family:'Sora';font-weight:700;font-size:1.02rem}
.tb-user .role{font-size:.76rem;color:var(--navy);opacity:.8}
.tb-actions{display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--glass-border);background:rgba(255,255,255,.5);
  display:grid;place-items:center;cursor:pointer;color:var(--navy);transition:.25s var(--ease);position:relative}
.icon-btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px -8px rgba(46,52,62,.3)}
.icon-btn svg{width:20px;height:20px}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 2px #fff}
.menu-toggle{display:none}

/* Conteúdo */
.content{flex:1;padding:8px 28px 48px}
.view{display:none}
.view.active{display:block;animation:viewIn .55s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.page-head{margin:8px 0 22px}
.page-head h1{font-size:2rem;font-weight:800;color:var(--graphite)}
.page-head h1 b{color:var(--green-dark)}
.page-head p{color:var(--navy);opacity:.78;margin-top:4px;font-size:.95rem}

/* Cards genéricos */
.card{border-radius:var(--radius);padding:22px;background:var(--glass-bg);backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);
  transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.card.hoverable:hover{transform:translateY(-6px);box-shadow:0 30px 60px -22px rgba(46,52,62,.45),0 0 0 1px rgba(255,255,255,.7)}
.grid{display:grid;gap:18px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}

/* Scroll reveal */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.in{opacity:1;transform:none}

/* ---- HOME ---- */
.hero{display:flex;gap:26px;align-items:center;justify-content:space-between;border-radius:28px;padding:30px 34px;
  background:var(--green-dark);color:#fff;position:relative;overflow:hidden;
  box-shadow:0 18px 40px -20px rgba(46,52,62,.4)}
.hero h2{font-size:1.9rem;font-weight:800;position:relative}
.hero p{opacity:.92;max-width:460px;margin-top:8px;position:relative;line-height:1.5}
.hero .float{position:relative;animation:float 6s ease-in-out infinite}
.mock{width:230px;border-radius:18px;padding:18px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  backdrop-filter:blur(8px)}
.mock .bar{height:10px;border-radius:6px;background:rgba(255,255,255,.4);margin-bottom:10px}
.mock .bar.s{width:60%}.mock .bar.o{background:var(--orange);width:75%}
.mock .ring{width:78px;height:78px;border-radius:50%;margin:10px auto;
  background:conic-gradient(var(--orange) 0 72%,rgba(255,255,255,.25) 0);display:grid;place-items:center}
.mock .ring i{width:56px;height:56px;border-radius:50%;background:rgba(0,80,52,.9);display:grid;place-items:center;font-family:'Sora';font-weight:700;font-style:normal;font-size:1rem}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

.stat-ico{margin-bottom:14px}
.stat .big{font-family:'Sora';font-size:2.2rem;font-weight:800;line-height:1}
.stat .lbl{color:var(--navy);font-weight:500;margin-top:2px}
.stat .sub{font-size:.82rem;color:var(--graphite);opacity:.7;margin-top:8px}
.mini-list{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.mini-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.5);font-size:.88rem}
.mini-row .l{display:flex;align-items:center;gap:10px}
.pill{font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:20px}
.pill.ok{background:rgba(0,111,72,.14);color:var(--green-dark)}
.pill.warn{background:rgba(248,134,62,.18);color:var(--orange-dark)}
.pill.bad{background:rgba(176,42,42,.14);color:#b02a2a}
.dotmat{width:11px;height:11px;border-radius:4px;flex:none}

/* ---- CALENDÁRIO ---- */
.cal-wrap{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
.cal-board{background:var(--graphite);border-radius:24px;padding:26px;color:#fff;
  box-shadow:0 18px 50px -20px rgba(46,52,62,.5);position:relative;overflow:hidden}
.cal-board::before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);background-size:22px 22px;opacity:.6;pointer-events:none}
.cal-month{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;position:relative}
.cal-month h3{font-family:'Sora';font-size:1.4rem;font-weight:700}
.cal-month .switch{display:flex;background:rgba(255,255,255,.08);border-radius:30px;padding:4px;font-size:.78rem}
.cal-month .switch span{padding:7px 16px;border-radius:30px;cursor:pointer;font-weight:600;color:rgba(255,255,255,.6)}
.cal-month .switch span.on{background:var(--orange);color:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0;position:relative;
  border-radius:14px;overflow:hidden}
.cal-grid .ch{padding:14px 6px;font-family:'Sora';font-size:.62rem;color:rgba(255,255,255,.5);
  letter-spacing:.12em;text-transform:uppercase;font-weight:700;text-align:center;
  border-bottom:1px solid rgba(255,255,255,.1)}
.cal-day{display:flex;flex-direction:column;min-height:88px;padding:9px 8px;
  background:transparent;border-bottom:1px solid rgba(255,255,255,.06);transition:.25s var(--ease)}
.cal-day:hover{background:rgba(255,255,255,.04)}
.cal-day.dim .dd{color:rgba(255,255,255,.22)}
.cal-day .dd{font-family:'Sora';font-size:1.05rem;font-weight:600;color:#fff}
.cal-class{margin-top:auto;padding:5px 8px;border-radius:14px;color:#fff;
  font-family:'Sora';font-size:.68rem;font-weight:600;text-align:center;line-height:1.15;
  cursor:pointer;transition:.25s var(--ease);border:none}
.cal-class:hover{transform:scale(1.04);filter:brightness(1.1)}

/* Painel lateral de atividades */
.cal-side h4{font-family:'Sora';font-size:.78rem;color:var(--navy);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;font-weight:700}
.cal-event{display:flex;border-radius:14px;overflow:hidden;margin-bottom:10px;background:#fff;
  border:1px solid var(--glass-border);box-shadow:var(--soft-shadow);transition:.3s var(--ease)}
.cal-event:hover{transform:translateX(-3px);box-shadow:0 10px 22px -10px rgba(46,52,62,.35)}
.cal-event .num{flex:none;width:54px;color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:'Sora';font-weight:800;font-size:1.4rem}
.cal-event .info{padding:11px 14px;flex:1}
.cal-event .info .t{font-family:'Sora';font-weight:700;font-size:.84rem;color:var(--graphite)}
.cal-event .info .s{font-size:.74rem;color:var(--navy);opacity:.75;margin-top:2px;line-height:1.35}
@media(max-width:1080px){.cal-wrap{grid-template-columns:1fr}}

/* ---- FREQUÊNCIA / NOTAS tables ---- */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius)}
.freq-card{background:rgba(255,255,255,.62);border:1px solid var(--glass-border);border-radius:18px;
  padding:18px 22px;margin-bottom:14px;cursor:pointer;transition:.3s var(--ease);
  box-shadow:0 6px 18px -10px rgba(46,52,62,.2)}
.freq-card:hover{transform:translateY(-3px);background:#fff;box-shadow:0 16px 32px -16px rgba(46,52,62,.35)}
.freq-card.open{background:#fff;box-shadow:0 16px 36px -14px rgba(46,52,62,.35)}
.freq-head{display:flex;align-items:center;justify-content:space-between;gap:14px}
.freq-main{display:flex;align-items:center;gap:14px;flex:1;min-width:200px}
.freq-name{font-family:'Sora';font-weight:600}
.freq-sub{font-size:.78rem;color:var(--navy);opacity:.75;margin-top:2px}
.freq-right{display:flex;align-items:center;gap:14px}
.freq-count{font-family:'Sora';font-weight:800;font-size:1.5rem;min-width:34px;text-align:center}
.freq-count.ok{color:var(--green-dark)}.freq-count.warn{color:var(--orange-dark)}.freq-count.bad{color:#b02a2a}
.freq-chev{width:32px;height:32px;border-radius:10px;background:var(--gray-200);
  display:grid;place-items:center;color:var(--navy);transition:.4s var(--ease)}
.freq-chev svg{width:16px;height:16px}
.freq-card.open .freq-chev svg{transform:rotate(180deg)}
.freq-detail{max-height:0;overflow:hidden;transition:max-height .45s var(--ease)}
.freq-card.open .freq-detail{max-height:400px}
.freq-detail-in{padding:16px 0 4px;margin-top:14px;border-top:1px dashed rgba(52,66,114,.18)}
.freq-detail-in h5{font-family:'Sora';font-size:.76rem;color:var(--navy);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.fdays{display:flex;flex-wrap:wrap;gap:8px}
.fday{font-size:.78rem;padding:6px 12px;border-radius:20px;background:rgba(176,42,42,.12);color:#b02a2a;font-weight:500;
  display:flex;align-items:center;gap:6px}
.fday svg{width:13px;height:13px}

table.notas{width:100%;border-collapse:separate;border-spacing:0 10px}
table.notas th{font-family:'Sora';font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);
  text-align:center;padding:6px 14px;opacity:.8}
table.notas th:first-child{text-align:left}
table.notas td{background:rgba(255,255,255,.6);padding:16px 14px;text-align:center;font-weight:500;border-top:1px solid var(--glass-border);border-bottom:1px solid var(--glass-border);transition:.3s}
table.notas td:first-child{border-left:1px solid var(--glass-border);border-radius:14px 0 0 14px;text-align:left}
table.notas td:last-child{border-right:1px solid var(--glass-border);border-radius:0 14px 14px 0}
table.notas tr:hover td{background:#fff}
.disc-cell{display:flex;align-items:center;gap:12px;font-family:'Sora';font-weight:600;text-align:left}
.nota-in{width:62px;text-align:center;font-family:'Sora';font-weight:700;font-size:1rem;color:var(--graphite);
  border:1px solid var(--glass-border);border-radius:10px;padding:8px 4px;background:rgba(255,255,255,.8);outline:none;transition:.25s}
.nota-in:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(52,66,114,.15)}
.media{font-family:'Sora';font-weight:800;font-size:1.25rem}

/* ---- MATERIAL ---- */
.mat-card{background:rgba(255,255,255,.62);border:1px solid var(--glass-border);border-radius:14px;
  padding:11px 16px;margin-bottom:7px;cursor:pointer;transition:.3s var(--ease);
  box-shadow:0 4px 12px -8px rgba(46,52,62,.18)}
.mat-card:hover{transform:translateY(-2px);background:#fff;box-shadow:0 10px 22px -12px rgba(46,52,62,.3)}
.mat-card.open{background:#fff;box-shadow:0 12px 26px -12px rgba(46,52,62,.3)}
.mat-head{display:flex;align-items:center;gap:12px}
.mat-head .ti{font-family:'Sora';font-weight:600;font-size:.95rem}
.mat-head .su{font-size:.74rem;color:var(--navy);opacity:.75}
.mat-head .chev{margin-left:auto;width:28px;height:28px;border-radius:9px;background:var(--gray-200);
  display:grid;place-items:center;color:var(--navy);transition:.4s var(--ease)}
.mat-head .chev svg{width:14px;height:14px}
.mat-card.open .mat-head .chev svg{transform:rotate(180deg)}
.mat-action{max-height:0;overflow:hidden;transition:max-height .4s var(--ease)}
.mat-card.open .mat-action{max-height:80px}
.mat-action-in{padding-top:12px;margin-top:10px;border-top:1px dashed rgba(52,66,114,.18);display:flex;justify-content:flex-start}
.dl-btn{display:inline-flex;align-items:center;gap:9px;padding:9px 16px;border-radius:11px;border:none;cursor:pointer;
  font-family:'Sora';font-weight:600;font-size:.82rem;color:#fff;background:var(--orange);
  box-shadow:0 6px 14px -8px rgba(46,52,62,.3);transition:.3s var(--ease)}
.dl-btn:hover{transform:translateY(-2px);background:var(--orange-dark);box-shadow:0 10px 18px -8px rgba(46,52,62,.35)}
.dl-btn svg{width:15px;height:15px}

/* ---- QUIZ / RANKING ---- */
/* ---- Quiz + Leaderboard ---- */
.quiz-main{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
.lb-panel{background:linear-gradient(145deg,#1a2140,#1c2850);color:#fff;border-radius:22px;padding:26px 24px;position:relative;overflow:hidden;box-shadow:0 20px 48px -16px rgba(18,26,58,.65)}
.lb-panel::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
.lb-tab{padding:6px 13px;border-radius:20px;border:none;cursor:pointer;font-family:'Sora';font-weight:600;font-size:.72rem;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);transition:.25s}
.lb-tab.active{background:var(--green-dark);color:#fff}
.lb-tab:hover:not(.active){background:rgba(255,255,255,.18)}
.quiz-card{background:#fff;border-radius:22px;padding:28px 26px;border:1px solid var(--glass-border);box-shadow:0 18px 40px -18px rgba(46,52,62,.22)}
.opt{display:flex;align-items:center;gap:14px;padding:14px 20px;border-radius:14px;background:var(--orange);color:#fff;margin-bottom:10px;cursor:pointer;transition:.25s var(--ease);font-family:'Sora';font-weight:600;font-size:.97rem}
.opt:hover:not(.locked){background:var(--orange-dark)}
.opt .balloon{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none;font-family:'Sora';font-weight:800;color:#fff;font-size:.92rem;transition:.3s}
.opt .balloon svg{width:18px;height:18px}
.opt.correct{background:var(--green-dark)}
.opt.correct .balloon{background:#fff;color:var(--green-dark)}
.opt.wrong{background:#b02a2a}
.opt.wrong .balloon{background:#fff;color:#b02a2a}
.opt.locked{cursor:default}
.quiz-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.score-tag{font-family:'Sora';font-weight:700;color:var(--green-dark)}

/* ---- SUPORTE ---- */
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:11px 22px;border-radius:12px 12px 0 0;border:1px solid var(--glass-border);border-bottom:none;cursor:pointer;
  font-family:'Sora';font-weight:600;font-size:.86rem;background:rgba(255,255,255,.45);color:var(--navy);transition:.3s}
.tab.active{background:linear-gradient(135deg,var(--navy),#46568f);color:#fff}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.fg{display:flex;flex-direction:column;gap:6px}
.fg label{font-family:'Sora';font-size:.76rem;font-weight:600;color:var(--navy);letter-spacing:.02em}
.fg input,.fg select,.fg textarea{font-family:inherit;font-size:.9rem;padding:11px 14px;border-radius:11px;border:1px solid var(--glass-border);
  background:rgba(255,255,255,.75);color:var(--graphite);outline:none;transition:.25s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(52,66,114,.13);background:#fff}
.fg input[disabled]{background:rgba(231,235,241,.6);color:#7a818c;cursor:not-allowed}
.warn-msg{display:flex;align-items:center;gap:9px;color:var(--orange-dark);font-size:.85rem;font-weight:500;margin-top:6px}
.form-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.req-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-radius:12px;background:rgba(255,255,255,.55);margin-bottom:9px}
.req-row .ri{display:flex;flex-direction:column}.req-row .ri b{font-family:'Sora';font-size:.9rem}.req-row .ri small{color:var(--navy);opacity:.75}

/* ---- BIBLIOTECA ---- */
.lib-top{display:flex;gap:14px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.lib-search{flex:1;min-width:240px;display:flex;align-items:center;gap:10px;padding:13px 18px;border-radius:14px;
  background:rgba(255,255,255,.7);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
.lib-search svg{width:19px;height:19px;color:var(--navy);opacity:.7}
.lib-search input{flex:1;border:none;background:none;outline:none;font-family:inherit;font-size:.95rem;color:var(--graphite)}
.lib-filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 16px;border-radius:20px;border:1px solid var(--glass-border);background:rgba(255,255,255,.55);cursor:pointer;
  font-size:.8rem;font-weight:600;color:var(--navy);transition:.25s}
.chip:hover{background:#fff}.chip.active{background:linear-gradient(135deg,var(--green-dark),var(--green-mid));color:#fff;border-color:transparent}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:20px}
.book{cursor:pointer;transition:transform .4s var(--ease)}
.book:hover{transform:translateY(-8px)}
.book-cover{aspect-ratio:3/4.2;border-radius:12px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  padding:14px;color:#fff;box-shadow:0 18px 40px -18px rgba(46,52,62,.55);border:1px solid rgba(255,255,255,.25)}
.book-cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:rgba(0,0,0,.22)}
.book-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.18),transparent 40%)}
.book-cover .bt{font-family:'Sora';font-weight:700;font-size:.92rem;line-height:1.18;position:relative;z-index:1}
.book-cover .ba{font-size:.7rem;opacity:.85;margin-top:5px;position:relative;z-index:1}
.book-cover .tag{position:absolute;top:10px;right:10px;font-size:.6rem;background:rgba(255,255,255,.25);padding:3px 8px;border-radius:10px;backdrop-filter:blur(4px);z-index:1}
.book .meta{margin-top:10px}
.book .meta .n{font-family:'Sora';font-weight:600;font-size:.85rem;line-height:1.2}
.book .meta .au{font-size:.74rem;color:var(--navy);opacity:.75;margin-top:2px}

/* ---- Modais / Toast ---- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(46,52,62,.45);backdrop-filter:blur(6px);display:none;place-items:center;padding:24px}
.overlay.show{display:grid;animation:viewIn .3s ease}
.modal{width:min(440px,100%);border-radius:24px;padding:30px;background:var(--glass-bg-strong);
  backdrop-filter:blur(26px);border:1px solid var(--glass-border);box-shadow:0 40px 90px -30px rgba(0,0,0,.5);animation:rise .4s var(--ease)}
.modal.lg{width:min(560px,100%)}
.modal h3{font-size:1.3rem;margin-bottom:6px}.modal p.sub{color:var(--navy);opacity:.8;font-size:.88rem;margin-bottom:18px}
.modal .field-l{margin-bottom:14px}
.modal .field-l label{display:block;font-family:'Sora';font-size:.78rem;font-weight:600;color:var(--navy);margin-bottom:6px}
.modal .field-l input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--glass-border);background:rgba(255,255,255,.8);outline:none;font-family:inherit}
.modal .field-l input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(52,66,114,.13)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.book-view{display:flex;gap:22px}
.book-view .bigcover{width:160px;flex:none}
.book-view .bigcover .book-cover{box-shadow:0 26px 50px -20px rgba(46,52,62,.6)}
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:80;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:12px;padding:14px 20px;border-radius:14px;background:var(--glass-bg-strong);
  backdrop-filter:blur(18px);border:1px solid var(--glass-border);box-shadow:0 18px 40px -16px rgba(46,52,62,.5);
  font-size:.9rem;font-weight:500;animation:toastIn .4s var(--ease);max-width:340px}
.toast .ti{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;background:var(--green-dark)}
.toast.warn .ti{background:var(--orange-dark)}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* ---------- Responsivo ---------- */
@media(max-width:1080px){.g-3,.g-4{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr 1fr}.cal-grid{grid-template-columns:repeat(2,1fr)}.quiz-main{grid-template-columns:1fr}}
@media(max-width:860px){
  #app.show{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:260px;transform:translateX(-105%);transition:.4s var(--ease)}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.3)}
  .menu-toggle{display:grid}
  .login-card{flex-direction:column}.login-brand{padding:36px 30px}.brand-name{font-size:2rem}
  .quiz-main,.g-4,.g-3,.g-2,.form-grid,.cal-grid{grid-template-columns:1fr}
  .hero{flex-direction:column;text-align:center}.hero .float{margin-top:6px}
  .content{padding:8px 16px 40px}.topbar{margin:12px}
  .book-view{flex-direction:column;align-items:center;text-align:center}
}
.sb-backdrop{display:none;position:fixed;inset:0;background:rgba(46,52,62,.4);z-index:29}
.sb-backdrop.show{display:block}

/* ===== Calendário — visão semanal ===== */
.week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.week-day{display:flex;flex-direction:column;min-height:300px;border-radius:18px;padding:0 0 12px;
  background:var(--glass-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);overflow:hidden;transition:transform .35s var(--ease)}
.week-day:hover{transform:translateY(-4px)}
.week-day .wd-head{padding:14px;background:var(--navy);color:#fff;text-align:center}
.week-day.today .wd-head{background:var(--green-dark)}
.week-day .wd-head .dn{font-family:'Sora';font-weight:700;font-size:.95rem}
.week-day .wd-head .dd{font-size:.72rem;opacity:.8;margin-top:2px}
.week-items{padding:12px;display:flex;flex-direction:column;gap:10px}
.week-item{padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.6);border-left:4px solid var(--navy);
  transition:.25s var(--ease)}
.week-item:hover{background:#fff;transform:translateX(3px)}
.week-item.late{border-left-color:#d23b3b}
.week-item.soon{border-left-color:#2f6bd6}
.week-item.far{border-left-color:var(--green-mid)}
.week-item.note-it{border-left-color:var(--orange);background:rgba(248,134,62,.1)}
.week-item .wm{font-family:'Sora';font-weight:600;font-size:.82rem;display:flex;align-items:center;gap:7px}
.week-item .wa{font-size:.74rem;color:var(--navy);opacity:.82;margin-top:4px;line-height:1.3}
.prazo-tag{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:.66rem;font-weight:700;font-family:'Sora';
  padding:3px 9px;border-radius:20px}
.prazo-tag.late{background:rgba(210,59,59,.15);color:#c0392b}
.prazo-tag.soon{background:rgba(47,107,214,.15);color:#2f6bd6}
.prazo-tag.far{background:rgba(38,122,63,.15);color:var(--green-dark)}
.prazo-tag.note{background:rgba(248,134,62,.18);color:var(--orange-dark)}
.legend-dot{width:24px;height:14px;border-radius:8px;display:inline-block}

/* ===== Anotações ===== */
.note-form{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.note-form .full{grid-column:1/-1}
.note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:22px}
.note-card{border-radius:18px;padding:18px;background:rgba(255,255,255,.62);border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);position:relative;transition:.3s var(--ease);display:flex;flex-direction:column}
.note-card:hover{transform:translateY(-4px);background:#fff}
.note-card .nt{font-family:'Sora';font-weight:700;font-size:1rem;color:var(--graphite);padding-right:26px}
.note-card .nmeta{font-size:.72rem;color:var(--navy);opacity:.7;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.note-card .ntext{font-size:.86rem;color:var(--graphite);opacity:.9;line-height:1.45;flex:1}
.note-card .nacts{display:flex;gap:8px;margin-top:14px}
.note-del{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:9px;border:none;cursor:pointer;
  background:var(--gray-200);color:var(--graphite);display:grid;place-items:center;transition:.25s}
.note-del:hover{background:#f3d3d3;color:#c0392b}.note-del svg{width:14px;height:14px}
.note-add-cal{font-size:.76rem;padding:8px 13px}
.added-badge{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;color:var(--green-dark)}
.added-badge svg{width:14px;height:14px}

/* ===== Cardápio ===== */
.menu-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.menu-day{border-radius:20px;overflow:hidden;background:rgba(255,255,255,.62);border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);transition:transform .35s var(--ease)}
.menu-day:hover{transform:translateY(-5px)}
.menu-day .md-head{padding:16px;text-align:center;background:var(--green-dark);color:#fff}
.menu-day.today .md-head{background:var(--orange)}
.menu-day .md-head .dn{font-family:'Sora';font-weight:700}
.menu-day .md-head .dt{font-size:.7rem;opacity:.85;margin-top:2px}
.menu-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.menu-item{display:flex;gap:10px;align-items:flex-start}
.menu-item .mi-ic{font-size:1.05rem;line-height:1.2;flex:none}
.menu-item .mi-l{font-family:'Sora';font-size:.66rem;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.04em}
.menu-item .mi-v{font-size:.84rem;color:var(--graphite);line-height:1.3}

/* ===== Fórum ===== */
.forum-wrap{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
.post{border-radius:18px;padding:18px;background:rgba(255,255,255,.6);border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);margin-bottom:14px;transition:.3s var(--ease)}
.post:hover{background:#fff}
.post-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.post-av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:'Sora';font-weight:700;flex:none}
.post-who{flex:1}
.post-who .pn{font-family:'Sora';font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.post-who .pt{font-size:.72rem;color:var(--navy);opacity:.7}
.role-tag{font-size:.64rem;font-weight:700;font-family:'Sora';padding:2px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em}
.role-tag.escola{background:rgba(0,111,72,.14);color:var(--green-dark)}
.role-tag.prof{background:rgba(52,66,114,.14);color:var(--navy)}
.role-tag.resp{background:rgba(248,134,62,.16);color:var(--orange-dark)}
.post-body{font-size:.9rem;color:var(--graphite);line-height:1.5}
.post-foot{display:flex;align-items:center;gap:16px;margin-top:12px;font-size:.78rem;color:var(--navy);opacity:.75}
.post-foot span{display:flex;align-items:center;gap:6px;cursor:pointer;transition:.2s}.post-foot span:hover{opacity:1;color:var(--green-dark)}
.post-foot svg{width:15px;height:15px}
.forum-side .fs-card{border-radius:18px;padding:18px;background:var(--graphite);color:#fff;box-shadow:var(--glass-shadow);margin-bottom:16px}
.forum-side .fs-card h4{font-family:'Sora';font-size:.95rem;margin-bottom:12px}
.forum-side .fs-row{display:flex;align-items:center;gap:10px;font-size:.82rem;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.forum-side .fs-row:last-child{border-bottom:none}
.forum-side .fs-row .fdot{width:9px;height:9px;border-radius:50%;flex:none}
/* Comentários do fórum */
.post-av.sm{width:32px;height:32px;font-size:.72rem}
.comments{max-height:0;overflow:hidden;transition:max-height .45s var(--ease);margin-top:0}
.post .comments.open{max-height:1200px;margin-top:14px}
.comment-list{border-top:1px dashed rgba(52,66,114,.18);padding-top:12px}
.comment{display:flex;gap:10px;margin-bottom:12px}
.comment-body{flex:1;background:rgba(231,235,241,.55);border-radius:12px;padding:10px 13px}
.comment-body .cm-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem;font-family:'Sora'}
.comment-body .cm-time{font-size:.7rem;color:var(--navy);opacity:.6;font-family:'Be Vietnam Pro'}
.comment-body .cm-text{font-size:.86rem;color:var(--graphite);margin-top:4px;line-height:1.4}
.comment-form{display:flex;align-items:center;gap:10px}
.comment-form input{flex:1;border:1px solid var(--glass-border);border-radius:11px;padding:10px 14px;font-family:inherit;
  font-size:.88rem;outline:none;background:rgba(255,255,255,.85)}
.comment-form input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(52,66,114,.12);background:#fff}
.comment-form .dl-btn{flex:none;padding:9px 15px;font-size:.8rem}
@media(max-width:1080px){.week-grid,.menu-grid{grid-template-columns:repeat(2,1fr)}.forum-wrap{grid-template-columns:1fr}.note-form{grid-template-columns:1fr}}
@media(max-width:680px){.week-grid,.menu-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="bg-mesh"></div>
<canvas id="particles"></canvas>

<!-- ============================ TELA DE LOGIN ============================ -->
<section id="login-screen">

const DATAS_SEMANA = {"Segunda":"11/05","Terça":"12/05","Quarta":"13/05","Quinta":"14/05","Sexta":"15/05"};
let calView = "semana";
let CURRENT_USER = null; // { nome, role } — preenchido no login

  {id:"relatorios",label:"Relatórios",        icon:ICON.doc,     roles:['professor']},
  {id:"material",  label:"Material Online",   icon:ICON.file,    roles:['aluno','professor']},
  {id:"cardapio",  label:"Cardápio",          icon:ICON.food,    roles:['aluno','professor']},
  {id:"quiz",      label:"Jogos / Quiz",      icon:ICON.game,    roles:['aluno','professor']},
  {id:"forum",     label:"Fórum Acadêmico",   icon:ICON.chat,    roles:['aluno','professor']},
  {id:"biblioteca",label:"Biblioteca",        icon:ICON.library, roles:['aluno','professor']},
  {id:"sistema",   label:"Sistema",           icon:ICON.life,    roles:['dev']},
  {id:"perfis",    label:"Perfis de Acesso",  icon:ICON.trophy,  roles:['dev']},
  {id:"suporte",   label:"Suporte",           icon:ICON.life,    roles:['aluno','professor','dev']},
];
function buildNav(){
  const role = CURRENT_USER ? CURRENT_USER.role : 'aluno';
  const visible = NAV.filter(n => n.roles.includes(role));
  document.getElementById('nav').innerHTML = visible.map(n=>
    `<div class="nav-item" data-view="${n.id}">${svg(n.icon)}${n.label}</div>`).join('');
  document.querySelectorAll('.nav-item[data-view]').forEach(el=>{
    el.onclick=()=>{ go(el.dataset.view); closeSidebar(); };
  });
}
function go(view){
  const role = CURRENT_USER ? CURRENT_USER.role : 'aluno';
  const navItem = NAV.find(n => n.id === view);
  if(navItem && !navItem.roles.includes(role)){
    toast("Acesso não permitido para este perfil.","warn");
    RENDER['home']();
    document.querySelectorAll('.nav-item[data-view]').forEach(e=>e.classList.toggle('active',e.dataset.view==='home'));
    return;
  }
  document.querySelectorAll('.nav-item[data-view]').forEach(e=>e.classList.toggle('active',e.dataset.view===view));
  if(RENDER[view]) RENDER[view]();
  document.getElementById('content').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ================= RENDERIZADORES DE PÁGINA ================= */
function setView(html){
  const c=document.getElementById('content');
  c.innerHTML = `<div class="view active">${html}</div>`;
  initReveal();
}
const head=(t,b,sub)=>`<div class="page-head reveal"><h1>${t} <b>${b}</b></h1>${sub?`<p>${sub}</p>`:''}</div>`;

const RENDER = {

        </div></div>
      </div>

      <div class="grid g-3" style="margin-top:22px">
        <div class="card hoverable reveal stat">
          <div class="stat-ico"><div class="gicon" style="color:var(--navy)">${svg(ICON.calendar)}</div></div>

/* ================= FUNÇÕES AUXILIARES ================= */
function media(arr){return arr.reduce((a,b)=>a+(parseFloat(b)||0),0)/arr.length;}
function countAulas(){return Object.values(CALENDARIO).reduce((a,d)=>a+d.length,0);}
function hoje(){const d=new Date();return d.toLocaleDateString('pt-BR');}

/* ---- Calendário: alternar visão Semana / Mês ---- */
function setCalView(v){ calView=v; RENDER.calendario(); }

/* Classe de prazo: <1 dia (24h) vermelho; 1–7 azul; >7 verde */
function prazoClasse(d){ if(d<1) return 'late'; if(d>7) return 'far'; return 'soon'; }
function prazoTexto(d){
  if(d<1) return 'menos de 24h';
  if(d===1) return 'amanhã';
  if(d>7) return 'em '+d+' dias';
  return 'em '+d+' dias';
}

/* Visão semanal */
function weekCalendar(){
  const grid = DIAS_SEMANA.map(dia=>{
    const aulas = SEMANA[dia]||[];
    const notas = USER_EVENTS[dia]||[];
    const today = dia==='Quarta';
    return `
      <div class="week-day ${today?'today':''}">
        <div class="wd-head"><div class="dn">${dia}${today?' · hoje':''}</div><div class="dd">${DATAS_SEMANA[dia]} · 2026</div></div>
        <div class="week-items">
          ${aulas.map(c=>{const k=prazoClasse(c.prazo);return `
            <div class="week-item ${k}">
              <div class="wm"><span class="dotmat" style="background:${CORES[c.m]}"></span>${c.m}</div>
              <div class="wa">${c.a}</div>
              <span class="prazo-tag ${k}">⏱ ${prazoTexto(c.prazo)}</span>
            </div>`;}).join('')}
          ${notas.map(t=>`
            <div class="week-item note-it">
              <div class="wm">${svg(ICON.note,'').replace('<svg','<svg style="width:15px;height:15px;color:var(--orange-dark)"')} Anotação</div>

  return `

      </div>
      <span style="font-family:'Sora';font-weight:700;font-size:.8rem;color:var(--navy);opacity:.65;white-space:nowrap">${quizIndex+1} / ${QUIZ.length}</span>
    </div>
    <div style="font-size:.72rem;font-weight:700;color:var(--navy);opacity:.6;letter-spacing:.07em;text-transform:uppercase;margin-bottom:12px">Pergunta ${quizIndex+1} de ${QUIZ.length}</div>
    <div style="font-family:'Sora';font-weight:700;font-size:1.08rem;color:var(--graphite);line-height:1.45;margin-bottom:20px">${q.q}</div>
    <div id="quiz-opts">
      ${q.ops.map((o,i)=>`<div class="opt" onclick="answer(${i})"><span class="balloon">${String.fromCharCode(65+i)}</span>${o}</div>`).join('')}
    </div>
    <div class="quiz-foot">
      <span class="score-tag">Acertos: ${quizScore}/${QUIZ.length}</span>
      <button class="glow-btn green" id="quiz-next" style="display:none" onclick="nextQuestion()">Próxima ›</button>
    </div>`;
}
function answer(i){
  const q=QUIZ[quizIndex];
  const opts=document.querySelectorAll('#quiz-opts .opt');
  if(opts[0].classList.contains('locked'))return;
  opts.forEach((o,idx)=>{
    o.classList.add('locked');
    if(idx===q.c){o.classList.add('correct');o.querySelector('.balloon').innerHTML=svg(ICON.checkmark);}
    if(idx===i && i!==q.c){o.classList.add('wrong');o.querySelector('.balloon').innerHTML=svg(ICON.x);}
  });
  if(i===q.c){quizScore++;toast("Resposta correta! 🎉","ok");}else{toast("Resposta incorreta.","warn");}
  const next=document.getElementById('quiz-next');
  next.style.display='inline-flex';
  next.textContent = quizIndex<QUIZ.length-1?'Próxima ›':'Reiniciar quiz';
}
function nextQuestion(){
  if(quizIndex<QUIZ.length-1){quizIndex++;}
  else{quizIndex=0;quizScore=0;toast("Quiz reiniciado!","ok");}
  document.getElementById('quiz-box').innerHTML=renderQuestion();
}

/* ================= UTILIDADES DE COR ================= */
function shade(hex,p){let n=parseInt(hex.slice(1),16);let r=(n>>16)+p,g=(n>>8&255)+p,b=(n&255)+p;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);}
function hexA(hex,a){let n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`;}

/* ================= GERADOR DE PDF (mínimo, válido) ================= */
function generatePDF(title, lines){
  const ascii=s=>(''+s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x00-\x7F]/g,'');
  const esc=s=>ascii(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  let c="BT\n/F1 24 Tf 0 0.43 0.28 rg 1 0 0 1 60 770 Tm ("+esc(title)+") Tj\n/F2 12 Tf 0.16 0.18 0.24 rg";
  let y=730; for(const ln of lines){c+=" 1 0 0 1 60 "+y+" Tm ("+esc(ln)+") Tj"; y-=22;}
  c+="\nET";
  const objs=[
    "<</Type/Catalog/Pages 2 0 R>>",
    "<</Type/Pages/Kids[3 0 R]/Count 1>>",
    "<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 5 0 R/F2 6 0 R>>>>/Contents 4 0 R>>",
    "<</Length "+c.length+">>\nstream\n"+c+"\nendstream",
    "<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold>>",
    "<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>"
  ];
  let pdf="%PDF-1.4\n"; const off=[];
  objs.forEach((o,i)=>{off.push(pdf.length);pdf+=(i+1)+" 0 obj\n"+o+"\nendobj\n";});
  const xref=pdf.length;
  pdf+="xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n";
  off.forEach(o=>pdf+=String(o).padStart(10,'0')+" 00000 n \n");
  pdf+="trailer\n<</Size "+(objs.length+1)+"/Root 1 0 R>>\nstartxref\n"+xref+"\n%%EOF";
  return new Blob([pdf],{type:'application/pdf'});
}

/* ================= MODAIS / TOAST ================= */
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show');}));
function toast(msg,type='ok'){
  const w=document.getElementById('toasts');
  const t=document.createElement('div');t.className='toast '+(type==='warn'?'warn':'');
  t.innerHTML=`<div class="ti">${svg(type==='warn'?ICON.warn:ICON.checkmark,'').replace('<svg','<svg style="width:18px;height:18px"')}</div><span>${msg}</span>`;
  w.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(30px)';t.style.transition='.4s';setTimeout(()=>t.remove(),400);},3000);
}

/* ================= SCROLL REVEAL ================= */
let revealObs;
function initReveal(){
  if(revealObs)revealObs.disconnect();
  revealObs=new IntersectionObserver((es)=>{es.forEach((e,i)=>{if(e.isIntersecting){setTimeout(()=>e.target.classList.add('in'),i*60);revealObs.unobserve(e.target);}});},{threshold:.08});
  document.querySelectorAll('.reveal').forEach(el=>revealObs.observe(el));
}

/* ================= LOGIN / SESSÃO ================= */
const lgPass=document.getElementById('lg-pass');
document.getElementById('lg-eye').onclick=function(){lgPass.type=lgPass.type==='password'?'text':'password';};
async function doLogin(){
  const u=document.getElementById('lg-user').value.trim();
  const p=document.getElementById('lg-pass').value;
  const err=document.getElementById('lg-err');
  if(!u||!p){err.textContent="Informe usuário e senha para entrar.";return;}
  err.textContent="";
  try{
    const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const json=await res.json();
    if(!res.ok){err.textContent=json.error||'Erro ao entrar.';return;}
    loadData(json.data);
    CURRENT_USER = json.user; // { nome, iniciais, role }
    const nome=json.user.nome.split(' ')[0]||'Aluno';
    document.getElementById('tb-name').textContent="Olá, "+nome;
    document.getElementById('avatar').textContent=json.user.iniciais;
    // Atualizar label de perfil na topbar
    const roleLabel = { aluno:'Aluno', professor:'Professor', dev:'Desenvolvedor' };
    document.getElementById('tb-role').textContent = roleLabel[json.user.role] || json.user.role;
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').classList.add('show');
    buildNav(); go('home');
  }catch(e){err.textContent='Erro de conexão com o servidor.';}
}
document.getElementById('lg-enter').onclick=doLogin;
lgPass.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('lg-user').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

document.getElementById('nav-logout').onclick=async()=>{
  await fetch('/api/auth/logout',{method:'POST'});
  CURRENT_USER = null;
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-screen').style.display='grid';
  document.getElementById('lg-pass').value='';
};

/* Trocar senha */
document.getElementById('open-change').onclick=()=>openModal('modal-pass');
document.getElementById('open-change-2').onclick=()=>openModal('modal-pass');
document.getElementById('pw-save').onclick=async()=>{
  const nw=document.getElementById('pw-new').value, cf=document.getElementById('pw-conf').value;
  const err=document.getElementById('pw-err');
  const res=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({newPass:nw,confirm:cf})});
  const json=await res.json();
  if(!res.ok){err.textContent=json.error;return;}
  err.textContent="";closeModal('modal-pass');
  document.getElementById('pw-cur').value=document.getElementById('pw-new').value=document.getElementById('pw-conf').value='';
  toast("Senha alterada com sucesso!","ok");
};

/* Sidebar mobile */
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sb-backdrop').classList.remove('show');}
document.getElementById('menu-toggle').onclick=()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('sb-backdrop').classList.toggle('show');};
document.getElementById('sb-backdrop').onclick=closeSidebar;

/* ================= PARTÍCULAS DE FUNDO ================= */
(function(){
  const cv=document.getElementById('particles'),ctx=cv.getContext('2d');
  let w,h,parts;
  function resize(){w=cv.width=innerWidth;h=cv.height=innerHeight;parts=Array.from({length:Math.min(46,Math.floor(w/34))},()=>({
    x:Math.random()*w,y:Math.random()*h,r:Math.random()*2.4+0.6,
    dx:(Math.random()-.5)*0.25,dy:(Math.random()-.5)*0.25,
    c:[ [0,111,72],[52,66,114],[248,134,62] ][Math.floor(Math.random()*3)],a:Math.random()*0.25+0.06}));}
  resize();addEventListener('resize',resize);
  (function loop(){ctx.clearRect(0,0,w,h);
    parts.forEach(p=>{p.x+=p.dx;p.y+=p.dy;
      if(p.x<0||p.x>w)p.dx*=-1;if(p.y<0||p.y>h)p.dy*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=`rgba(${p.c[0]},${p.c[1]},${p.c[2]},${p.a})`;ctx.fill();});
    requestAnimationFrame(loop);})();
})();
</script>
